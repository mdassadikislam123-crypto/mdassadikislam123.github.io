<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S FF TopUp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>A.S FF TopUp</h2>
    <form>
        <div class="form-group">
            <label for="uid">প্লেয়ার ইউআইডি (Player UID):</label>
            <input type="text" id="uid" name="uid" placeholder="আপনার গেম ইউআইডি লিখুন" required>
        </div>
        
        <div class="form-group">
            <label for="package">প্যাকেজ নির্বাচন করুন:</label>
            <select id="package" name="package">
                <option value="100_diamond">১০০ ডায়মন্ড</option>
                <option value="310_diamond">৩১০ ডায়মন্ড</option>
                <option value="520_diamond">৫২০ ডায়মন্ড</option>
            </select>
        </div>

        <div class="form-group">
            <label for="payment">পেমেন্ট মেথড:</label>
            <select id="payment" name="payment">
                <option value="bkash">বিকাশ (bKash)</option>
                <option value="rocket">রকেট (Rocket)</option>
            </select>
        </div>

        <button type="submit">অর্ডার নিশ্চিত করুন</button>
    </form>
</div>

</body>
</html>
